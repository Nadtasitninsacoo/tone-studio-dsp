# Build Setup.exe on GitHub and attach it to a Release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# A Windows runner builds the engine, bundles the bridge and compiles the installer with the
# same packaging\build-installer.ps1 used locally, so a release and a local build are one
# path. The tag should match `project(... VERSION x.y.z)` in CMakeLists.txt — the installer
# takes its version from there, not from the tag.
name: Release installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: ./packaging/build-installer.ps1

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ToneStudioEngine-Setup-*.exe

      - name: Keep as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToneStudioEngine-Setup
          path: dist/ToneStudioEngine-Setup-*.exe
